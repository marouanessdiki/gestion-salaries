<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #333; text-anchor: middle; }
    .entity { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
    .attribute { font-family: Arial, sans-serif; font-size: 10px; fill: #333; }
    .note { font-family: Arial, sans-serif; font-size: 10px; fill: #666; }
  </style>
  
  <text x="450" y="30" class="title">Gestion Salaries - Entity Relationship Diagram</text>
  
  <!-- Employe Entity -->
  <rect x="50" y="100" width="200" height="250" fill="lightblue" stroke="black" stroke-width="2"/>
  <text x="150" y="125" class="entity" text-anchor="middle" font-weight="bold">Employe</text>
  <line x1="50" y1="140" x2="250" y2="140" stroke="black"/>
  <text x="60" y="160" class="attribute">* id : Long (PK)</text>
  <text x="60" y="180" class="attribute">* nom : String</text>
  <text x="60" y="200" class="attribute">* prenom : String</text>
  <text x="60" y="220" class="attribute">* cin : String</text>
  <text x="60" y="240" class="attribute">* poste : String</text>
  <text x="60" y="260" class="attribute">* dateEmbauche : LocalDate</text>
  <text x="60" y="280" class="attribute">* salaire : Double</text>
  <text x="60" y="300" class="attribute">* sexe : String</text>
  <text x="60" y="320" class="attribute">* cnssNumero : String</text>
  
  <!-- Attestation Entity -->
  <rect x="350" y="100" width="200" height="180" fill="lightblue" stroke="black" stroke-width="2"/>
  <text x="450" y="125" class="entity" text-anchor="middle" font-weight="bold">Attestation</text>
  <line x1="350" y1="140" x2="550" y2="140" stroke="black"/>
  <text x="360" y="160" class="attribute">* id : Long (PK)</text>
  <text x="360" y="180" class="attribute">* employeId : Long (FK)</text>
  <text x="360" y="200" class="attribute">* typeAttestation : String</text>
  <text x="360" y="220" class="attribute">* dateGeneration : LocalDateTime</text>
  <text x="360" y="240" class="attribute">* cheminFichier : String</text>
  
  <!-- AttestationTemplate Entity -->
  <rect x="650" y="100" width="200" height="140" fill="lightblue" stroke="black" stroke-width="2"/>
  <text x="750" y="125" class="entity" text-anchor="middle" font-weight="bold">AttestationTemplate</text>
  <line x1="650" y1="140" x2="850" y2="140" stroke="black"/>
  <text x="660" y="160" class="attribute">* id : Long (PK)</text>
  <text x="660" y="180" class="attribute">* name : String (UNIQUE)</text>
  <text x="660" y="200" class="attribute">* jrxml : String (LOB)</text>
  <text x="660" y="220" class="attribute">* updatedAt : LocalDateTime</text>
  
  <!-- Hr Entity -->
  <rect x="50" y="400" width="200" height="200" fill="lightblue" stroke="black" stroke-width="2"/>
  <text x="150" y="425" class="entity" text-anchor="middle" font-weight="bold">Hr</text>
  <line x1="50" y1="440" x2="250" y2="440" stroke="black"/>
  <text x="60" y="460" class="attribute">* id : Long (PK)</text>
  <text x="60" y="480" class="attribute">* username : String (UNIQUE)</text>
  <text x="60" y="500" class="attribute">* password : String</text>
  <text x="60" y="520" class="attribute">* isApproved : Boolean</text>
  <text x="60" y="540" class="attribute">* fullName : String</text>
  <text x="60" y="560" class="attribute">* email : String</text>
  <text x="60" y="580" class="attribute">* position : String</text>
  
  <!-- Relationships -->
  <line x1="250" y1="200" x2="350" y2="200" stroke="black" stroke-width="2"/>
  <text x="300" y="190" class="attribute" text-anchor="middle">1:N</text>
  
  <line x1="550" y1="150" x2="650" y2="150" stroke="black" stroke-width="2"/>
  <text x="600" y="140" class="attribute" text-anchor="middle">N:1</text>
  
  <line x1="150" y1="350" x2="450" y2="200" stroke="black" stroke-width="2"/>
  <text x="280" y="270" class="attribute" text-anchor="middle">creates</text>
  
  <!-- Note -->
  <rect x="50" y="620" width="800" height="60" fill="lightyellow" stroke="black" stroke-width="1"/>
  <text x="60" y="640" class="note">Note: This is a placeholder diagram. To generate the actual ER diagram,</text>
  <text x="60" y="660" class="note">install PlantUML and run: plantuml docs/uml/data_er.puml</text>
</svg>
